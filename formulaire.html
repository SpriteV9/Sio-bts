<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body bgcolor="cyan">
 <section>
  <form action="formulaire.html" method="post">
    <header><h1>Inscription d'un Nouveau client</h1></header>
       <label for="nom">Nom :</label>
       <input type="text" id="nom" name="nom">
       <label for="prenom">prenom :</label>
       <input type="prenom" id="prenom" name="prenom">
       <br>
       <br>
       <label for="date naissance">Date de naissance :</label><input type="date" id="date_naissance" name="date_naissance">
       <br>
       <br>
       <label for="email">Adresse mail :</label>
       <input type="email" id="email" name="email">
       <br>
       <br> 
       <label for="mdp">Mot de passe :</label>
       <input type="password" id="mdp">
       <br>
       <br>

       <label for="anciennete">nombre d'années d'ancienneté :</label>
       <input type="number" id="anciennete" name="ancienneté" min="0" max="80">
       <br>
       <br>
       <label for="ville">ville :</label>
       <select id="ville" name="ville">
       	   <option value="paris">paris</option>
       	   <option value="versailles">versailles</option>
       	   <option value="creteil">créteil</option>
       </select>
       <br>
       <br>

       <label for="adresse">Adresse du client :</label>
       <textarea id="adresse" name="adresse" rows="4" cols="30"></textarea>
       <br>
       <br>

<p>Situation matrimoniale :</p>
      <label for="marie_oui">Marié</label>
      <input type="radio" id="marie_oui" name="marie" value="oui">
      <label for="marie_non">Non marié</label>
      <input type="radio" id="marie_non" name="marie" value="non">
      <br>
      <br>

<p>Préférence de voiture :</p>
      <label for="pref_auto">Automatique</label>
      <input type="checkbox" id="pref_auto" name="preference_auto" value="automatique">
      <label for="pref_auto" name="preference_auto" value="automatique">
      <label for="pref_manuelle">Manuelle</label>
      <input type="checkbox" id="pref_manuelle" name="preference_manuelle" value="manuelle">
      <br>
      <br>
      <button type="submit">Enregistrer</button>
      <button type="reset">Annuler</button>
   </form>
  </section>

  <footer>
  	<p>&copy; 2026 Agence Mediterranée - Location de véhicules</p>
  </footer>

</body>
</html>
